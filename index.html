<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica ANTLR4 - Traducción de Notas Musicales a Audio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- jsPDF via CDN para generación de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F3EEF9;
      color: #322144;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Container Principal -->
  <main class="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-[#E3D8F0] p-6 sm:p-8 space-y-6">
    
    <!-- Encabezado -->
    <header class="text-center space-y-1">
      <span class="px-3 py-1 bg-[#EAE0F5] text-[#5B3E7A] text-xs font-semibold rounded-full uppercase tracking-wider">Práctica ANTLR4</span>
      <h1 class="text-2xl font-bold text-[#4A2E68] pt-1">Traducción de Notas a Audio</h1>
    </header>

    <!-- Área de Alerta / Mensajes de Error -->
    <div id="statusAlert" class="hidden rounded-2xl p-4 border transition-all duration-300">
      <div class="flex items-start gap-3">
        <svg id="alertIcon" class="w-5 h-5 shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"></svg>
        <div class="flex-1 text-sm font-medium" id="alertMessage"></div>
      </div>
    </div>

    <!-- Área de Entrada de Texto -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <label for="noteInput" class="text-xs font-semibold text-[#6C538B] uppercase tracking-wider">Notas musicales </label>
        <span class="text-xs text-[#9B72CF]">Ej: | Re4:1.5 Do4:0.5 |</span>
      </div>
      <textarea 
        id="noteInput" 
        rows="5" 
        class="w-full p-4 rounded-2xl bg-[#FAF7FC] border border-[#E3D8F0] focus:border-[#9B72CF] focus:ring-2 focus:ring-[#9B72CF]/20 transition-all outline-none resize-none text-base text-[#322144] placeholder-purple-300 font-mono"
        placeholder="| Re4:1.5 Do4:0.5 Do4:2 | Sol#3 La#3 Mi4 Fa4"
        oninput="clearAlert()"> Re4:1.5 Do4:0.5 Do4:2  Sol#3 La#3 Mi4 Fa4</textarea>
    </div>

    <!-- Botón Principal: Reproducir Audio -->
    <div>
      <button 
        onclick="playAudio()" 
        class="w-full bg-[#9B72CF] hover:bg-[#885BC4] active:scale-[0.99] text-white font-medium py-3.5 px-4 rounded-xl transition-all shadow-md shadow-[#9B72CF]/25 flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>Convertir y Reproducir Audio</span>
      </button>
    </div>

    <hr class="border-[#E3D8F0]" />

    <!-- Sección de Exportación y Generación de Archivos -->
    <div class="space-y-3">
      <p class="text-xs font-semibold text-[#6C538B] uppercase tracking-wider px-1">Generar y Descargar Archivos</p>

      <!-- Botón Único de Descarga General -->
      <button 
        onclick="downloadAll()" 
        class="w-full bg-[#9B72CF] hover:bg-[#885BC4] active:scale-[0.99] text-white font-medium py-3.5 px-4 rounded-xl transition-all shadow-md shadow-[#9B72CF]/25 flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Descargar Todos los Archivos (.WAV, .BZL, .PDF)</span>
      </button>
    </div>

  </main>

  <script>
    let audioCtx = null;

    const BASE_FREQS = {
      'C0': 16.35, 'C#0': 17.32, 'DB0': 17.32, 'D0': 18.35, 'D#0': 19.45, 'EB0': 19.45, 'E0': 20.60, 'F0': 21.83, 'F#0': 23.12, 'GB0': 23.12, 'G0': 24.50, 'G#0': 25.96, 'AB0': 25.96, 'A0': 27.50, 'A#0': 29.14, 'BB0': 29.14, 'B0': 30.87,
      'C1': 32.70, 'C#1': 34.65, 'DB1': 34.65, 'D1': 36.71, 'D#1': 38.89, 'EB1': 38.89, 'E1': 41.20, 'F1': 43.65, 'F#1': 46.25, 'GB1': 46.25, 'G1': 49.00, 'G#1': 51.91, 'AB1': 51.91, 'A1': 55.00, 'A#1': 58.27, 'BB1': 58.27, 'B1': 61.74,
      'C2': 65.41, 'C#2': 69.30, 'DB2': 69.30, 'D2': 73.42, 'D#2': 77.78, 'EB2': 77.78, 'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'GB2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'AB2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'BB2': 116.54, 'B2': 123.47,
      'C3': 130.81, 'C#3': 138.59, 'DB3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'EB3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'GB3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'AB3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'BB3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'DB4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'EB4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'GB4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'AB4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'BB4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'C#5': 554.37, 'DB5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'EB5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'GB5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'AB5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'BB5': 932.33, 'B5': 987.77,
      'C6': 1046.50, 'C#6': 1108.73, 'DB6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'EB6': 1244.51, 'E6': 1318.51, 'F6': 1396.91, 'F#6': 1479.98, 'GB6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'AB6': 1661.22, 'A6': 1760.00, 'A#6': 1864.66, 'BB6': 1864.66, 'B6': 1975.53,
      'C7': 2093.00, 'C#7': 2217.46, 'DB7': 2217.46, 'D7': 2349.32, 'D#7': 2489.02, 'EB7': 2489.02, 'E7': 2637.02, 'F7': 2793.83, 'F#7': 2959.96, 'GB7': 2959.96, 'G7': 3135.96, 'G#7': 3322.44, 'AB7': 3322.44, 'A7': 3520.00, 'A#7': 3729.31, 'BB7': 3729.31, 'B7': 3951.07,
      'C8': 4186.01, '_': 0, 'REST': 0, 'SILENCIO': 0
    };

    function translateSolfegetoEnglish(token) {
      if (token === '_' || token === 'REST' || token === 'SILENCIO') return token;

      let t = token
        .replace(/DOS(?=\d|$)/g, 'DO#')
        .replace(/RES(?=\d|$)/g, 'RE#')
        .replace(/FAS(?=\d|$)/g, 'FA#')
        .replace(/SOLS(?=\d|$)/g, 'SOL#')
        .replace(/LAS(?=\d|$)/g, 'LA#')
        .replace(/SIS(?=\d|$)/g, 'SI#');

      t = t.replace(/^SOL/, 'G')
           .replace(/^DO/, 'C')
           .replace(/^RE/, 'D')
           .replace(/^MI/, 'E')
           .replace(/^FA/, 'F')
           .replace(/^LA/, 'A')
           .replace(/^SI/, 'B');

      return t;
    }

    function showAlert(message, isError = true) {
      const statusAlert = document.getElementById('statusAlert');
      const alertMessage = document.getElementById('alertMessage');
      const alertIcon = document.getElementById('alertIcon');

      statusAlert.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-green-50', 'border-green-200', 'text-green-700');

      if (isError) {
        statusAlert.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
        alertIcon.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>`;
      } else {
        statusAlert.classList.add('bg-green-50', 'border-green-200', 'text-green-700');
        alertIcon.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>`;
      }

      alertMessage.textContent = message;
    }

    function clearAlert() {
      const statusAlert = document.getElementById('statusAlert');
      statusAlert.classList.add('hidden');
    }

    function parseInputDetailed() {
      clearAlert();
      const text = document.getElementById('noteInput').value.trim();

      if (!text) {
        showAlert('Por favor, ingresa notas musicales antes de continuar.');
        return null;
      }

      const cleanText = text.replace(/\|/g, ' ').replace(/-/g, ' ').replace(/,/g, ' ');
      const tokens = cleanText.toUpperCase().split(/\s+/);

      const parsedNotes = [];
      const invalidTokens = [];

      for (let rawToken of tokens) {
        if (!rawToken) continue;

        let parts = rawToken.split(':');
        let rawNote = parts[0];
        let mult = parts[1] ? parseFloat(parts[1]) : 1.0;
        if (isNaN(mult)) mult = 1.0;

        const englishToken = translateSolfegetoEnglish(rawNote);
        let key = englishToken;

        if (!BASE_FREQS.hasOwnProperty(key) && BASE_FREQS.hasOwnProperty(key + '4')) {
          key = key + '4';
        }

        if (BASE_FREQS.hasOwnProperty(key)) {
          parsedNotes.push({
            original: rawToken,
            english: key,
            freq: BASE_FREQS[key],
            durationMultiplier: mult
          });
        } else {
          invalidTokens.push(rawToken);
        }
      }

      if (invalidTokens.length > 0) {
        const uniqueInvalids = [...new Set(invalidTokens)];
        const listStr = uniqueInvalids.map(t => `'${t}'`).join(', ');
        showAlert(`Error: Se encontraron notas o caracteres inválidos: ${listStr}. Revisa tu sintaxis.`);
        return null;
      }

      return parsedNotes;
    }

    function playAudio() {
      const notes = parseInputDetailed();
      if (!notes) return;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const baseDuration = 0.4;
      let currentTime = audioCtx.currentTime;

      notes.forEach((note) => {
        let noteDuration = baseDuration * note.durationMultiplier;
        if (note.freq > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.freq, currentTime);

          gain.gain.setValueAtTime(0, currentTime);
          gain.gain.linearRampToValueAtTime(0.3, currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, currentTime + noteDuration - 0.05);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(currentTime);
          osc.stop(currentTime + noteDuration);
        }
        currentTime += noteDuration;
      });

      showAlert('Reproduciendo melodía...', false);
    }

    async function downloadAudioFile() {
      const notes = parseInputDetailed();
      if (!notes) return;

      const baseDuration = 0.4;
      let totalDuration = 0;
      notes.forEach(n => totalDuration += (baseDuration * n.durationMultiplier));

      const sampleRate = 44100;
      const totalSamples = Math.ceil(sampleRate * totalDuration);
      const offlineCtx = new OfflineAudioContext(1, totalSamples, sampleRate);

      let currentOffset = 0;
      notes.forEach((note) => {
        let noteDuration = baseDuration * note.durationMultiplier;
        if (note.freq > 0) {
          const osc = offlineCtx.createOscillator();
          const gain = offlineCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.freq, currentOffset);

          gain.gain.setValueAtTime(0, currentOffset);
          gain.gain.linearRampToValueAtTime(0.3, currentOffset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, currentOffset + noteDuration - 0.05);

          osc.connect(gain);
          gain.connect(offlineCtx.destination);

          osc.start(currentOffset);
          osc.stop(currentOffset + noteDuration);
        }
        currentOffset += noteDuration;
      });

      const buffer = await offlineCtx.startRendering();
      const wavBlob = audioBufferToWav(buffer);

      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'audio.wav';
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadBzlFile() {
      const text = document.getElementById('noteInput').value;
      const bzlHeader = `#  Archivo Bazilio (.bzl)\n#  Notas Musicales con barras de compás\n\n`;
      const blob = new Blob([bzlHeader + text], { type: 'text/plain;charset=utf-8' });

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'notas.bzl';
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderScoreCanvas(notes) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const widthPerNote = 32;
      const paddingLeft = 110;
      const paddingRight = 40;
      const calculatedWidth = Math.max(700, paddingLeft + notes.length * widthPerNote + paddingRight);
      const height = 180;

      canvas.width = calculatedWidth;
      canvas.height = height;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, calculatedWidth, height);

      ctx.strokeStyle = '#D1D5DB';
      ctx.lineWidth = 1;
      ctx.strokeRect(1, 1, calculatedWidth - 2, height - 2);

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 20px Times New Roman, serif';
      ctx.fillText('♩ = 120', 120, 38);

      const lineSpacing = 10;
      const staffTop = 70;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.2;

      for (let i = 0; i < 5; i++) {
        const y = staffTop + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(calculatedWidth - 30, y);
        ctx.stroke();
      }

      ctx.font = '52px serif';
      ctx.fillText('🎼', 32, staffTop + 38);

      ctx.font = 'bold 30px "Times New Roman", serif';
      ctx.fillText('C', 82, staffTop + 31);

      const noteSteps = {
        'C4': -2, 'D4': -1, 'E4': 0, 'F4': 1, 'G4': 2, 'A4': 3, 'B4': 4,
        'C5': 5,  'D5': 6,  'E5': 7, 'F5': 8, 'G5': 9, 'A5': 10, 'B5': 11
      };

      notes.forEach((noteObj, idx) => {
        const x = paddingLeft + idx * widthPerNote;
        const keyBase = noteObj.english.replace('#', '').replace('B', '');
        const step = noteSteps[keyBase] !== undefined ? noteSteps[keyBase] : 0;
        const noteY = (staffTop + 40) - (step * (lineSpacing / 2));

        if (keyBase === 'C4') {
          ctx.beginPath();
          ctx.moveTo(x - 8, noteY);
          ctx.lineTo(x + 8, noteY);
          ctx.stroke();
        }

        ctx.save();
        ctx.translate(x, noteY);
        ctx.rotate(-0.35);
        ctx.beginPath();
        ctx.ellipse(0, 0, 5.2, 3.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.beginPath();
        ctx.lineWidth = 1.5;
        if (step >= 4) {
          ctx.moveTo(x - 4.5, noteY);
          ctx.lineTo(x - 4.5, noteY + 28);
        } else {
          ctx.moveTo(x + 4.5, noteY);
          ctx.lineTo(x + 4.5, noteY - 28);
        }
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.moveTo(calculatedWidth - 30, staffTop);
      ctx.lineTo(calculatedWidth - 30, staffTop + 40);
      ctx.stroke();

      return canvas.toDataURL('image/png');
    }

    function downloadPDFFile(notes) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');

      doc.setFillColor(74, 46, 104);
      doc.rect(0, 0, 210, 24, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(15);
      doc.setFont("helvetica", "bold");
      doc.text("Práctica ANTLR4: Traducción de Notas a Audio (Bazilio)", 14, 15);

      doc.setTextColor(50, 33, 68);
      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");

      const fecha = new Date().toLocaleString('es-ES');
      doc.text(`Fecha de Generación: ${fecha}`, 14, 32);
      doc.text(`Total de Notas Procesadas: ${notes.length}`, 14, 37);
      doc.text(`Secuencia con soporte de duraciones y barras |`, 14, 42);

      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(74, 46, 104);
      doc.text("Partitura generada por el intérprete para Bazilio:", 14, 52);

      const scoreImgData = renderScoreCanvas(notes);
      const imgWidth = 182;
      const imgHeight = 46;
      doc.addImage(scoreImgData, 'PNG', 14, 56, imgWidth, imgHeight);

      doc.setFontSize(8);
      doc.setTextColor(138, 117, 163);

      doc.save('Partitura.pdf');
    }

    // DESCARGAR TODOS LOS ARCHIVOS A LA VEZ
    async function downloadAll() {
      const notes = parseInputDetailed();
      if (!notes) return;

      downloadBzlFile();
      setTimeout(() => downloadPDFFile(notes), 300);
      setTimeout(() => downloadAudioFile(), 600);

      showAlert('¡Todos los archivos (.BZL, .PDF, .WAV) se han generado y descargado con éxito!', false);
    }

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sample = 0;
      let offset = 0;
      let pos = 0;

      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          out.setUint8(pos++, str.charCodeAt(i));
        }
      }

      function setUint16(data) {
        out.setUint16(pos, data, true);
        pos += 2;
      }

      function setUint32(data) {
        out.setUint32(pos, data, true);
        pos += 4;
      }

      writeString('RIFF');
      setUint32(length - 8);
      writeString('WAVE');
      writeString('fmt ');
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      writeString('data');
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out.buffer], { type: 'audio/wav' });
    }
  </script>
</body>
